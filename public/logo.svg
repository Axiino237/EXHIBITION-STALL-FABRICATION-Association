<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Carbon Navy Badge Fill -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: 0 - 90) -->
  <g transform="translate(10, 8)">
    <!-- Hexagonal Shield Base with Gold Rim -->
    <polygon points="42,2 80,22 80,62 42,82 4,62 4,22" fill="url(#badgeBg)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />

    <!-- Architectural Exhibition Booth Truss Lines inside Shield -->
    <!-- Pillars & Floor Platform -->
    <line x1="20" y1="62" x2="64" y2="62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="26" y1="62" x2="26" y2="30" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="58" y1="62" x2="58" y2="30" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Cross Bracing Trusses (Stall Engineering) -->
    <line x1="26" y1="36" x2="58" y2="54" stroke="#FBBF24" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="26" y1="54" x2="58" y2="36" stroke="#FBBF24" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Cantilever Canopy Roof Structure -->
    <polygon points="18,30 42,16 66,30 58,34 42,23 26,34" fill="url(#goldGrad)" />

    <!-- Center 3D Isometric Stall Cube -->
    <polygon points="42,32 54,39 42,46 30,39" fill="#FFFFFF" />
    <polygon points="30,39 42,46 42,58 30,51" fill="#94A3B8" />
    <polygon points="54,39 42,46 42,58 54,51" fill="#F59E0B" />

    <!-- Star of Excellence at Top Vertex -->
    <circle cx="42" cy="10" r="3" fill="#FDE68A" />
  </g>

  <!-- TYPOGRAPHY / LOGO TEXT -->
  <!-- Main Association Acronym & Badge -->
  <text x="112" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="2.5" fill="#FFFFFF">
    ESFA
  </text>
  <!-- Gold Period & Suffix -->
  <text x="210" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)">
    .
  </text>
  <rect x="228" y="22" width="68" height="24" rx="5" fill="url(#goldGrad)" />
  <text x="262" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#0B1220">
    INDIA
  </text>

  <!-- Full Association Name -->
  <text x="114" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2" fill="url(#goldGrad)">
    EXPO &amp; STALL FABRICATORS ASSOCIATION
  </text>

  <!-- Official Sangam Sub-caption -->
  <text x="114" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#94A3B8">
    NATIONAL INDUSTRY SANGAM &bull; DESIGN &bull; FABRICATION &bull; EXPO SERVICES
  </text>
</svg>
