<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(245, 158, 11, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="150" fill="url(#bgGrad)" />
  <rect width="300" height="300" rx="150" fill="url(#grid)" />

  <!-- Outer Architectural Ring -->
  <circle cx="150" cy="150" r="144" stroke="url(#goldRim)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Executive Silhouette Graphic -->
  <g transform="translate(0, 10)">
    <!-- Head -->
    <ellipse cx="150" cy="115" rx="42" ry="52" fill="#1E293B" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Shoulders & Lapel Silhouette -->
    <path d="M75 240 C80 185, 115 170, 150 170 C185 170, 220 185, 225 240 Z" fill="#1E293B" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Tie / Collar Accent in Gold -->
    <path d="M142 170 L150 190 L158 170 Z" fill="#F59E0B" fill-opacity="0.8" />
    <path d="M147 190 L153 190 L155 235 L145 235 Z" fill="#F59E0B" fill-opacity="0.6" />
  </g>

  <!-- Watermark text -->
  <text x="150" y="272" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#F59E0B" fill-opacity="0.8">
    EXECUTIVE COMMITTEE
  </text>
</svg>
